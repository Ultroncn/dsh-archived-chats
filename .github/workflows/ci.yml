name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit / ubuntu / Node 18
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "18"
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run --json

  native-host:
    name: Native / ${{ matrix.label }} / Node 24
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu
            fixture: native-host
          - os: macos-latest
            label: macos
            fixture: native-host
          - os: windows-latest
            label: windows
            fixture: native-host
          - os: ubuntu-latest
            label: ubuntu / DSH 0.2.1
            fixture: native-host-0.2.1
          - os: macos-latest
            label: macos / DSH 0.2.1
            fixture: native-host-0.2.1
          - os: windows-latest
            label: windows / DSH 0.2.1
            fixture: native-host-0.2.1
          - os: ubuntu-latest
            label: ubuntu / DSH 0.2.1-rc.5
            fixture: native-host-0.2.1-rc.5
          - os: macos-latest
            label: macos / DSH 0.2.1-rc.5
            fixture: native-host-0.2.1-rc.5
          - os: windows-latest
            label: windows / DSH 0.2.1-rc.5
            fixture: native-host-0.2.1-rc.5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci
      - run: npm test
        if: runner.os != 'Windows'
      - name: Run Windows tests with failure diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & npm test 2>&1 | ForEach-Object { "$_" }
          $testExitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($testExitCode -ne 0) {
            for ($i = 0; $i -lt $output.Count; $i++) {
              if ($output[$i] -match 'not ok|AssertionError|ERR_ASSERTION|Error:|npm error|✖') {
                $last = [Math]::Min($output.Count - 1, $i + 24)
                $message = ($output[$i..$last] -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Windows test failure::$message"
              }
            }
          }
          exit $testExitCode
      - name: Install locked official Host fixture
        run: npm ci --prefix test/fixtures/${{ matrix.fixture }} --ignore-scripts --include=optional
      - name: Run mandatory native Host integration
        run: node scripts/run-native-integration.mjs --fixture-root test/fixtures/${{ matrix.fixture }}
      - run: npm pack --dry-run --json
